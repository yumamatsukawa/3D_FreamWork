<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" role="img" aria-label="EventBus で、お互いを知らない物同士をつなぐ流れ">
<defs><marker id="ah-eventbus" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahead"/></marker></defs>
<text class="lb" x="10" y="18" text-anchor="start"><tspan x="10" dy="0">送る側（Publish）</tspan></text>
<text class="lb" x="330" y="18" text-anchor="start"><tspan x="330" dy="0">EventBus（名前 → 登録された関数の一覧）</tspan></text>
<text class="lb" x="640" y="18" text-anchor="start"><tspan x="640" dy="0">聞く側（Subscribe）</tspan></text>
<g class="box g-core"><rect x="10" y="30" width="270" height="56" rx="6"/><text x="145" y="52" text-anchor="middle" font-size="13">EnemyController</text><text x="145" y="69" text-anchor="middle" font-size="13">Publish(&quot;EnemyDefeated&quot;)</text></g>
<g class="box g-core"><rect x="10" y="120" width="270" height="56" rx="6"/><text x="145" y="142" text-anchor="middle" font-size="13">PlayerController</text><text x="145" y="159" text-anchor="middle" font-size="13">Publish(&quot;PlayerDied&quot;)</text></g>
<g class="box g-core"><rect x="10" y="210" width="270" height="56" rx="6"/><text x="145" y="232" text-anchor="middle" font-size="13">PlayerController</text><text x="145" y="249" text-anchor="middle" font-size="13">PublishObject(&quot;FireBullet&quot;, owner)</text></g>
<g class="box g-animation"><rect x="330" y="30" width="190" height="56" rx="6"/><text x="425" y="52" text-anchor="middle" font-size="13">&quot;EnemyDefeated&quot;</text><text x="425" y="69" text-anchor="middle" font-size="13">→ 登録された関数 1つ</text></g>
<g class="box g-animation"><rect x="330" y="120" width="190" height="56" rx="6"/><text x="425" y="142" text-anchor="middle" font-size="13">&quot;PlayerDied&quot;</text><text x="425" y="159" text-anchor="middle" font-size="13">→ 登録された関数 2つ</text></g>
<g class="box g-animation"><rect x="330" y="210" width="190" height="56" rx="6"/><text x="425" y="232" text-anchor="middle" font-size="13">&quot;FireBullet&quot;</text><text x="425" y="249" text-anchor="middle" font-size="13">→ 関数 1つ（GameObject 付き）</text></g>
<line class="ln" x1="280" y1="58" x2="330" y2="58" marker-end="url(#ah-eventbus)"/>
<line class="ln" x1="280" y1="148" x2="330" y2="148" marker-end="url(#ah-eventbus)"/>
<line class="ln" x1="280" y1="238" x2="330" y2="238" marker-end="url(#ah-eventbus)"/>
<g class="box g-core"><rect x="570" y="30" width="240" height="56" rx="6"/><text x="690" y="52" text-anchor="middle" font-size="13">GameManager</text><text x="690" y="69" text-anchor="middle" font-size="13">score += 10</text></g>
<g class="box g-core"><rect x="570" y="105" width="240" height="40" rx="6"/><text x="690" y="127" text-anchor="middle" font-size="12">GameManager: ゲームオーバーにする</text></g>
<g class="box g-core"><rect x="570" y="155" width="240" height="40" rx="6"/><text x="690" y="177" text-anchor="middle" font-size="12">EnemyManager: 敵の出現を止める</text></g>
<g class="box g-core"><rect x="570" y="210" width="240" height="56" rx="6"/><text x="690" y="232" text-anchor="middle" font-size="13">BulletManager</text><text x="690" y="249" text-anchor="middle" font-size="13">撃った本人の向きに弾を出す</text></g>
<line class="ln dash" x1="520" y1="58" x2="570" y2="58" marker-end="url(#ah-eventbus)"/>
<line class="ln dash" x1="520" y1="140" x2="570" y2="125" marker-end="url(#ah-eventbus)"/>
<line class="ln dash" x1="520" y1="156" x2="570" y2="175" marker-end="url(#ah-eventbus)"/>
<line class="ln dash" x1="520" y1="238" x2="570" y2="238" marker-end="url(#ah-eventbus)"/>
<text class="lb" x="410" y="296" text-anchor="middle"><tspan x="410" dy="0">Subscribe は Init で登録しておく。Publish すると、登録された順に呼ばれる。</tspan></text>
<text class="lb" x="410" y="316" text-anchor="middle"><tspan x="410" dy="0">this を使うラムダを登録したら、Scene::Uninit() で EventBus::Get().Clear() を呼ぶ。</tspan></text>
</svg>
