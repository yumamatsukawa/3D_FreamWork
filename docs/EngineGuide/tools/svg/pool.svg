<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="800" role="img" aria-label="ObjectPool の使い回しの流れ">
<defs><marker id="ah-pool" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahead"/></marker></defs>
<g class="box n"><rect x="20" y="100" width="140" height="50" rx="6"/><text x="90" y="128.5" text-anchor="middle" font-size="15">まだ無い</text></g>
<g class="box g-audio"><rect x="290" y="100" width="190" height="50" rx="6"/><text x="385" y="119" text-anchor="middle" font-size="14">待機中</text><text x="385" y="137" text-anchor="middle" font-size="14">（非アクティブ・非表示）</text></g>
<g class="box g-render"><rect x="600" y="100" width="170" height="50" rx="6"/><text x="685" y="119" text-anchor="middle" font-size="15">使用中</text><text x="685" y="138" text-anchor="middle" font-size="15">（アクティブ）</text></g>
<line class="ln" x1="160" y1="125" x2="290" y2="125" marker-end="url(#ah-pool)"/>
<text class="lb" x="225" y="112" text-anchor="middle"><tspan x="225" dy="0">Prewarm</tspan></text>
<text class="lb" x="225" y="148" text-anchor="middle"><tspan x="225" dy="0">（任意。count 個）</tspan></text>
<line class="ln" x1="480" y1="112" x2="600" y2="112" marker-end="url(#ah-pool)"/>
<text class="lb" x="540" y="104" text-anchor="middle"><tspan x="540" dy="0">Rent</tspan></text>
<line class="ln" x1="600" y1="138" x2="480" y2="138" marker-end="url(#ah-pool)"/>
<text class="lb" x="540" y="160" text-anchor="middle"><tspan x="540" dy="0">Return</tspan></text>
<path class="ln" fill="none" d="M 90 100 C 90 20 685 20 685 100" marker-end="url(#ah-pool)"/>
<text class="lb" x="385" y="33" text-anchor="middle"><tspan x="385" dy="0">Rent で待機中が空いていない時: 新しく作って（Setup）、そのまま使用中にする</tspan></text>
<text class="lb" x="385" y="190" text-anchor="middle"><tspan x="385" dy="0">Rent = SetActive(true) / Return = SetActive(false)（Destroy ではない）</tspan></text>
<text class="lb" x="385" y="212" text-anchor="middle"><tspan x="385" dy="0">Setup（AddComponent を並べる処理）は、新しく作る時の1回だけ。</tspan></text>
<text class="lb" x="385" y="232" text-anchor="middle"><tspan x="385" dy="0">借りた物には前回の値（位置・色）が残っているので、毎回セットし直す。</tspan></text>
</svg>
