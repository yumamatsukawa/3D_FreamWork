<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" width="860" role="img" aria-label="SceneManager::ChangeScene から、新しいシーンが動き出すまで">
<defs><marker id="ah-scene" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahead"/></marker></defs>
<text class="lb" x="10" y="18" text-anchor="start"><tspan x="10" dy="0">演出付き ChangeScene&lt;T&gt;(FadeTransition())</tspan></text>
<text class="lb" x="470" y="18" text-anchor="start"><tspan x="470" dy="0">演出なし ChangeScene&lt;T&gt;()</tspan></text>
<g class="box g-core"><rect x="10" y="30" width="410" height="52" rx="6"/><text x="215" y="50" text-anchor="middle" font-size="13">① 切り替えを頼む（RequestChange）</text><text x="215" y="67" text-anchor="middle" font-size="13">途中なら無視。演出の Begin() ＋ Time を止める（倍率 0）</text></g>
<g class="box g-transition"><rect x="10" y="105" width="410" height="52" rx="6"/><text x="215" y="125" text-anchor="middle" font-size="13">② 覆う  transition-&gt;Update(止まらない時間)</text><text x="215" y="142" text-anchor="middle" font-size="13">画面がだんだん隠れる（ゲームの時間は止まっている）</text></g>
<g class="box g-physics"><rect x="10" y="180" width="410" height="150" rx="6"/><text x="215" y="206.5" text-anchor="middle" font-size="13">③ 覆い終わった（IsCovered）→ SwitchScene()</text><text x="215" y="223.5" text-anchor="middle" font-size="13">  1. 古いシーンの Uninit()</text><text x="215" y="240.5" text-anchor="middle" font-size="13">  2. ScreenEffect::OnSceneChanged() と CameraShake::Stop()</text><text x="215" y="257.5" text-anchor="middle" font-size="13">  3. 新しいシーンを作って Init()</text><text x="215" y="274.5" text-anchor="middle" font-size="13">  4. 使わなくなった画像・音・モデルを解放</text><text x="215" y="291.5" text-anchor="middle" font-size="13">     （Resources::UnloadUnused）</text><text x="215" y="308.5" text-anchor="middle" font-size="13">  → 演出の BeginOpen()</text></g>
<g class="box g-transition"><rect x="10" y="355" width="410" height="52" rx="6"/><text x="215" y="383.5" text-anchor="middle" font-size="13">④ 開く  画面がだんだん見えてくる</text></g>
<g class="box g-core"><rect x="10" y="430" width="410" height="66" rx="6"/><text x="215" y="448.5" text-anchor="middle" font-size="13">⑤ 開き終わった（IsFinished）</text><text x="215" y="465.5" text-anchor="middle" font-size="13">演出を片付けて、Time を元の倍率に戻す（Resume）</text><text x="215" y="482.5" text-anchor="middle" font-size="13">→ 以後は普通に Update / Draw</text></g>
<line class="ln" x1="215" y1="82" x2="215" y2="105" marker-end="url(#ah-scene)"/>
<line class="ln" x1="215" y1="157" x2="215" y2="180" marker-end="url(#ah-scene)"/>
<line class="ln" x1="215" y1="330" x2="215" y2="355" marker-end="url(#ah-scene)"/>
<line class="ln" x1="215" y1="407" x2="215" y2="430" marker-end="url(#ah-scene)"/>
<g class="box g-core"><rect x="470" y="30" width="380" height="52" rx="6"/><text x="660" y="58.5" text-anchor="middle" font-size="13">① 切り替えを頼む（nextScene に覚えるだけ）</text></g>
<g class="box g-physics"><rect x="470" y="105" width="380" height="98" rx="6"/><text x="660" y="131" text-anchor="middle" font-size="13">② 次の SceneManager::Update の最初で</text><text x="660" y="148" text-anchor="middle" font-size="13">   SwitchScene()（上の ③ と同じ）</text><text x="660" y="165" text-anchor="middle" font-size="13">   → 同じフレームで、新しいシーンの</text><text x="660" y="182" text-anchor="middle" font-size="13">   Update まで進む</text></g>
<line class="ln" x1="660" y1="82" x2="660" y2="105" marker-end="url(#ah-scene)"/>
<text class="lb" x="470" y="240" text-anchor="start"><tspan x="470" dy="0">どちらも、頼んでから終わるまでの間に呼ばれた</tspan></text>
<text class="lb" x="470" y="258" text-anchor="start"><tspan x="470" dy="0">ChangeScene は無視されます（二重押し対策）。</tspan></text>
<text class="lb" x="470" y="290" text-anchor="start"><tspan x="470" dy="0">ScreenEffect::Fade の onComplete の中で</tspan></text>
<text class="lb" x="470" y="308" text-anchor="start"><tspan x="470" dy="0">ChangeScene を呼ぶと、ScreenEffect::Update</tspan></text>
<text class="lb" x="470" y="326" text-anchor="start"><tspan x="470" dy="0">（SceneManager::Update の前）なので、</tspan></text>
<text class="lb" x="470" y="344" text-anchor="start"><tspan x="470" dy="0">同じフレームのうちに切り替わります。</tspan></text>
<text class="lb" x="470" y="380" text-anchor="start"><tspan x="470" dy="0">最初のシーンは main.cpp で</tspan></text>
<text class="lb" x="470" y="398" text-anchor="start"><tspan x="470" dy="0">ChangeScene&lt;TitleScene&gt;() を呼ぶと、</tspan></text>
<text class="lb" x="470" y="416" text-anchor="start"><tspan x="470" dy="0">Run の最初のフレームで始まります。</tspan></text>
</svg>
