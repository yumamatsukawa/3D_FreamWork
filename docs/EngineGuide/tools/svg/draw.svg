<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" role="img" aria-label="Scene::Draw の3つのパスと、その後の画面エフェクト・遷移">
<defs><marker id="ah-draw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahead"/></marker></defs>
<g class="box g-transition"><rect x="90" y="20" width="690" height="62" rx="6"/><text x="435" y="45" text-anchor="middle" font-size="14">⑤ シーン切り替えの演出  SceneManager::DrawTransition()</text><text x="435" y="63" text-anchor="middle" font-size="14">（FadeTransition / SpriteTransition。一番手前）</text></g>
<g class="box g-animation"><rect x="90" y="92" width="690" height="62" rx="6"/><text x="435" y="117" text-anchor="middle" font-size="14">④ 画面エフェクト  ScreenEffect::Draw()</text><text x="435" y="135" text-anchor="middle" font-size="14">（下から Vignette → Flash → Fade。文字より手前）</text></g>
<g class="box g-ui"><rect x="90" y="164" width="690" height="76" rx="6"/><text x="435" y="187" text-anchor="middle" font-size="14">③ パス3  FlushOverlayQueue()  ＝ 文字・四角（呼んだ順）</text><text x="435" y="205" text-anchor="middle" font-size="14">Text::Draw / TextRenderer / Image::DrawRect</text><text x="435" y="223" text-anchor="middle" font-size="14">GaugeRenderer / ButtonComponent の文字 / SliderComponent</text></g>
<g class="box g-behavior"><rect x="90" y="250" width="690" height="76" rx="6"/><text x="435" y="273" text-anchor="middle" font-size="14">② パス2  FlushUiQueue()  ＝ UI スプライト（drawPriority → 作った順）</text><text x="435" y="291" text-anchor="middle" font-size="14">SpriteMode::UI の SpriteRenderer、2D の粒（use3D=false）</text><text x="435" y="309" text-anchor="middle" font-size="14">深度を使わない。z は使わない。必ず最前面</text></g>
<g class="box g-render"><rect x="90" y="336" width="690" height="90" rx="6"/><text x="435" y="357" text-anchor="middle" font-size="14">① パス1  UI 以外（drawPriority が小さい順。同じなら transform.position.z が小さい順）</text><text x="435" y="375" text-anchor="middle" font-size="14">3D メッシュ・FBX・地形・水面 / World2D・World3D のスプライト</text><text x="435" y="393" text-anchor="middle" font-size="14">コライダーの枠などのデバッグの線 / 背景（Image::Draw）</text><text x="435" y="411" text-anchor="middle" font-size="14">※この間に出た UI スプライトと文字は、すぐには描かずに待ち行列に積む</text></g>
<line class="ln" x1="72" y1="440" x2="72" y2="30" marker-end="url(#ah-draw)"/>
<text class="lb" x="4" y="452" text-anchor="start"><tspan x="4" dy="0">先に描く</tspan></text>
<text class="lb" x="4" y="468" text-anchor="start"><tspan x="4" dy="0">（奥）</tspan></text>
<text class="lb" x="4" y="16" text-anchor="start"><tspan x="4" dy="0">後に描く</tspan></text>
<text class="lb" x="4" y="32" text-anchor="start"><tspan x="4" dy="0">（手前）</tspan></text>
<text class="lb" x="435" y="462" text-anchor="middle"><tspan x="435" dy="0">Scene::Draw が ①②③ を行い、GameEngine::Run が続けて ④⑤ を描いてから Text::EndDraw で画面に出します。</tspan></text>
</svg>
